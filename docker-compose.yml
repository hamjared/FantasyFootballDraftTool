services:
  draft-tool:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - PORT=8080
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "4446:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - draft-tool
    restart: unless-stopped
